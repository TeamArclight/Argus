name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: argus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Wait for PostgreSQL Service Readiness
        run: |
          python -c "
          import socket, time
          for i in range(30):
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.connect(('127.0.0.1', 5432))
                  s.close()
                  print('PostgreSQL port 5432 is open and ready.')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('PostgreSQL did not become ready in 30 seconds.')
          "
      - name: Verify PostgreSQL Alembic Upgrade and Drift Check
        env:
          ARGUS_JWT_SECRET: "12345678901234567890123456789012"
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/argus_test"
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run Backend Pytest Suite (PostgreSQL)
        env:
          ARGUS_JWT_SECRET: "12345678901234567890123456789012"
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/argus_test"
        run: pytest
      - name: Run Backend Pytest Suite (SQLite Fallback)
        env:
          ARGUS_JWT_SECRET: "12345678901234567890123456789012"
        run: pytest
      - name: Verify OpenAPI Schema Drift
        env:
          ARGUS_JWT_SECRET: "12345678901234567890123456789012"
        run: |
          python -m app.export_openapi
          diff -u candidate_openapi.json ../../contracts/openapi.json